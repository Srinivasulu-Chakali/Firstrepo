<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Shopping Website</title>
  <style>
    /* Basic Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      color: #333;
    }

    header {
      background-color: #4CAF50;
      padding: 1rem 2rem;
      color: white;
      text-align: center;
    }

    header h1 {
      margin-bottom: 0.25rem;
    }

    nav {
      margin-top: 0.5rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 1rem;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: white;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-image img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .product-details {
      padding: 1rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-title {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .product-price {
      color: #4CAF50;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    .btn-add {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 0.75rem;
      text-align: center;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }

    .btn-add:hover {
      background-color: #45a045;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1.5rem 2rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>ShopEasy</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <div class="container">
      <h2>Our Products</h2>
      <div class="product-grid">
        <div class="product-card">
          <div class="product-image">
            <img src="https://via.placeholder.com/300x180.png?text=Product+1" alt="Product 1" />
          </div>
          <div class="product-details">
            <div class="product-title">Wireless Headphones</div>
            <div class="product-price">₹1,499</div>
            <button class="btn-add">Add to Cart</button>
          </div>
        </div>

        <div class="product-card">
          <div class="product-image">
            <img src="https://via.placeholder.com/300x180.png?text=Product+2" alt="Product 2" />
          </div>
          <div class="product-details">
            <div class="product-title">Smart Watch</div>
            <div class="product-price">₹3,999</div>
            <button class="btn-add">Add to Cart</button>
          </div>
        </div>

        <div class="product-card">
          <div class="product-image">
            <img src="https://via.placeholder.com/300x180.png?text=Product+3" alt="Product 3" />
          </div>
          <div class="product-details">
            <div class="product-title">Bluetooth Speaker</div>
            <div class="product-price">₹999</div>
            <button class="btn-add">Add to Cart</button>
          </div>
        </div>

        <div class="product-card">
          <div class="product-image">
            <img src="https://via.placeholder.com/300x180.png?text=Product+4" alt="Product 4" />
          </div>
          <div class="product-details">
            <div class="product-title">Fitness Tracker</div>
            <div class="product-price">₹2,499</div>
            <button class="btn-add">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 ShopEasy. All rights reserved.
  </footer>

</body>
</html>
